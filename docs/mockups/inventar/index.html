<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollental Inventar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Hollental – Inventar (Skizze)
   Referenzauflösung 1920x1080, wird ins Fenster skaliert.
   Alle Farben als Tokens -> später 1:1 ins Godot-Theme.
   ========================================================= */
:root{
  --bg-deep:#06121f;
  --glass:#0b2238cc;
  --glass-2:#0e2b47d9;
  --card:#0f2a44e6;
  --card-hover:#143558;
  --line:#3f8fd6;
  --line-soft:#2a5f8f;
  --glow:#58b8ff;
  --ink:#eaf4ff;
  --ink-2:#a9c3dc;
  --ink-3:#7493b1;
  --accent:#6cc4ff;
  --accent-ink:#06223a;
  --hp:#3fdc8a;
  --en:#4aa8ff;
  --el:#5fd47a;           /* Element-Farbe des gewählten Wesens, wird per JS gesetzt */
  --radius:18px;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#02070d;overflow:hidden}
body{font-family:Signika,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- Bühne ---------- */
#viewport{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center;overflow:hidden;flex:none}

/* Wald-Hintergrund (Platzhalter für die echte Spielszene) */
.forest{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 50% at 70% 40%,#1b4a5a 0%,transparent 70%),
  radial-gradient(ellipse 50% 60% at 15% 70%,#123a33 0%,transparent 70%),
  linear-gradient(180deg,#0a2030 0%,#06141f 60%,#040b12 100%);filter:saturate(1.1)}
.forest .trunk{position:absolute;bottom:0;background:linear-gradient(90deg,#071019,#0d1d28 50%,#071019);border-radius:40% 40% 0 0;filter:blur(6px);opacity:.8}
.forest .bokeh{position:absolute;border-radius:50%;filter:blur(2px);opacity:.0;animation:bokeh 7s ease-in-out infinite}
@keyframes bokeh{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.8;transform:translateY(-30px)}}

/* ---------- Roboter-Knopf (Inventar geschlossen) ---------- */
#summon{position:absolute;right:70px;bottom:70px;display:flex;align-items:center;gap:16px;padding:10px 26px 10px 10px;border-radius:60px;background:var(--glass-2);border:2px solid var(--line-soft);box-shadow:0 0 30px #2e8fff44;opacity:0;pointer-events:none;transform:translateY(20px);transition:.4s var(--ease-out)}
#summon.show{opacity:1;pointer-events:auto;transform:none}
#summon:hover{border-color:var(--glow);box-shadow:0 0 40px #58b8ff88}
#summon:active{transform:scale(.96)}
#summon .robot{width:74px;height:74px}
#summon span{font-size:24px;font-weight:500}
#summon kbd{margin-left:6px}

/* ---------- Fenster ---------- */
#win{position:absolute;left:54px;top:40px;width:1812px;height:1000px;border-radius:34px;
  background:linear-gradient(160deg,#0e2a46e6,#081a2ce6 60%,#0a1f35f0);
  border:2px solid #3f8fd6aa;
  box-shadow:0 0 0 1px #9fd6ff22 inset,0 0 60px #2e8fff55,0 0 140px #1d6fd033;
  backdrop-filter:blur(8px);
  transform-origin:110px 70px}
#win.opening{animation:winOpen .9s var(--ease-out) both}
#win.closing{animation:winClose .5s cubic-bezier(.6,0,.8,.2) both}
#win.closed{display:none}
@keyframes winOpen{
  0%{opacity:0;transform:scale(.06);filter:brightness(3) blur(6px);clip-path:inset(0 0 0 0 round 34px)}
  45%{opacity:1;filter:brightness(1.8) blur(1px)}
  100%{opacity:1;transform:none;filter:none}}
@keyframes winClose{to{opacity:0;transform:scale(.06);filter:brightness(3) blur(6px)}}
/* Hologramm-Scanlinie beim Öffnen */
#win::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,#8fd3ff55 49%,#d6f0ff 50%,#8fd3ff55 51%,transparent 100%);
  background-size:100% 300%;background-position:0 -100%;opacity:0}
#win.opening::after{animation:scan 1.1s .2s var(--ease-out)}
@keyframes scan{0%{opacity:1;background-position:0 100%}100%{opacity:0;background-position:0 -100%}}

/* ---------- Kopf ---------- */
.head{position:absolute;left:40px;top:22px;right:40px;height:120px;display:flex;align-items:center}
.avatar{width:104px;height:104px;border-radius:50%;position:relative;cursor:pointer;transition:transform .3s var(--ease-spring)}
.avatar:hover{transform:scale(1.06) rotate(-4deg)}
.avatar:active{transform:scale(.94)}
.avatar .ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid #58b8ff55;animation:ringPulse 3s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:0}}
.brand{margin-left:28px}
.brand h1{font-size:46px;font-weight:600;letter-spacing:.18em;line-height:1;display:flex;align-items:center;gap:14px;color:#dff0ff;text-shadow:0 0 18px #58b8ff66}
.brand h1 svg{width:42px;height:42px}
.brand p{font-size:21px;color:var(--ink-2);margin-top:8px}
.speech{margin-left:40px;max-width:560px;padding:12px 22px;border-radius:16px;background:#0f2e4ccc;border:1.5px solid var(--line-soft);font-size:20px;color:var(--ink);opacity:0;transform:translateX(-14px) scale(.96);transition:.35s var(--ease-out);position:relative}
.speech::before{content:"";position:absolute;left:-9px;top:50%;width:16px;height:16px;background:inherit;border-left:1.5px solid var(--line-soft);border-bottom:1.5px solid var(--line-soft);transform:translateY(-50%) rotate(45deg)}
.speech.show{opacity:1;transform:none}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:20px;color:var(--ink-2)}
.status i{width:14px;height:14px;border-radius:50%;background:#3fdc8a;box-shadow:0 0 12px #3fdc8a;animation:blinkDot 2.4s ease-in-out infinite}
@keyframes blinkDot{50%{opacity:.45}}
.close{margin-left:70px;width:58px;height:58px;border-radius:14px;border:2px solid var(--line-soft);background:#0d2640;display:grid;place-items:center;transition:.25s var(--ease-out)}
.close svg{width:26px;height:26px;transition:transform .35s var(--ease-spring)}
.close:hover{border-color:var(--glow);box-shadow:0 0 18px #58b8ff77;background:#123354}
.close:hover svg{transform:rotate(90deg)}
.close:active{transform:scale(.9)}

/* ---------- Seitenleiste ---------- */
.side{position:absolute;left:24px;top:150px;width:276px;bottom:24px;border-radius:26px;background:#0a1e33b3;border:1.5px solid #2a5f8f66;padding:26px 0;overflow:hidden}
.side .leafdeco{position:absolute;left:-20px;bottom:120px;width:220px;opacity:.13}
.nav{list-style:none;display:flex;flex-direction:column;gap:14px;padding:0 14px}
.nav button{width:100%;height:82px;display:flex;align-items:center;gap:26px;padding:0 22px;border-radius:16px;font-size:25px;color:var(--ink);position:relative;transition:background .25s,transform .25s var(--ease-out),color .25s;border:1.5px solid transparent}
.nav button svg{width:44px;height:44px;flex:none;transition:transform .35s var(--ease-spring)}
.nav button:hover{background:#13365a88;transform:translateX(4px)}
.nav button:hover svg{transform:scale(1.12) rotate(-6deg)}
.nav button:active{transform:translateX(4px) scale(.97)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,#2a6fb5,#1d4f86);border-color:#6cc4ff99;box-shadow:0 0 22px #3c9cff55,0 0 0 1px #a8dcff33 inset}
.nav .bar{position:absolute;left:0;width:6px;height:82px;border-radius:0 6px 6px 0;background:var(--accent);box-shadow:0 0 16px var(--accent);transition:top .45s var(--ease-spring)}
.side .bottom{position:absolute;left:14px;right:14px;bottom:20px}
.divider{display:flex;align-items:center;gap:10px;margin:0 22px 14px}
.divider::before,.divider::after{content:"";flex:1;height:1.5px;background:#3f8fd666}
.divider svg{width:26px;height:26px;opacity:.75}
.settings{width:100%;height:72px;display:flex;align-items:center;gap:22px;padding:0 22px;border-radius:16px;font-size:23px;color:var(--ink-2);transition:.25s}
.settings svg{width:40px;height:40px;transition:transform .6s var(--ease-out)}
.settings:hover{background:#13365a88;color:var(--ink)}
.settings:hover svg{transform:rotate(120deg)}

/* ---------- Inhalt ---------- */
.content{position:absolute;left:330px;top:150px;right:30px;bottom:24px}
.tab{position:absolute;inset:0}
.tab[hidden]{display:none}
.tab.enter{animation:tabIn .5s var(--ease-out) both}
@keyframes tabIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}

.team-head{position:absolute;left:4px;top:6px;display:flex;align-items:baseline;gap:30px}
.team-head h2{font-size:42px;font-weight:600;display:flex;align-items:center;gap:16px}
.team-head h2 svg{width:42px;height:42px}
.team-head small{font-size:22px;color:var(--ink-2)}

/* Team-Karten */
.grid{position:absolute;left:0;top:76px;width:578px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{height:162px;border-radius:var(--radius);background:var(--card);border:1.5px solid #2a5f8f99;display:flex;align-items:center;gap:14px;padding:0 16px 0 10px;text-align:left;position:relative;overflow:hidden;
  transition:transform .3s var(--ease-out),border-color .3s,box-shadow .3s,background .3s}
.card .por{width:118px;height:118px;border-radius:50%;flex:none;border:3px solid #3f8fd6aa;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 45%,#163a5c),#0b1f33 75%);overflow:hidden;transition:transform .35s var(--ease-spring),border-color .3s,box-shadow .3s}
.card .por svg{width:100%;height:100%}
.card .info{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .nm{font-size:23px;font-weight:500}
.card .lv{font-size:22px;color:var(--ink-2)}
.card .el{display:flex;align-items:center;gap:8px;font-size:19px;color:var(--ink-2)}
.card .el svg{width:26px;height:26px}
.card .chev{position:absolute;right:12px;top:68px;width:26px;height:26px;opacity:.85;transition:transform .3s var(--ease-out)}
.card .buddy{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--ease-spring)}
.card .buddy svg{width:20px;height:20px}
.card.is-buddy .buddy{transform:scale(1)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#6cc4ff33,transparent 55%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-5px);border-color:#58b8ffcc;background:var(--card-hover);box-shadow:0 10px 30px #00000066,0 0 22px #3c9cff44}
.card:hover::before{opacity:1}
.card:hover .por{transform:scale(1.06) rotate(-3deg);border-color:var(--c)}
.card:hover .chev{transform:translateX(5px)}
.card:active{transform:translateY(-2px) scale(.97)}
.card[aria-pressed="true"]{border:2.5px solid #bfe6ff;box-shadow:0 0 0 1px #6cc4ff inset,0 0 30px #58b8ffaa,0 0 60px #3c9cff44;animation:selPulse 2.6s ease-in-out infinite}
@keyframes selPulse{50%{box-shadow:0 0 0 1px #6cc4ff inset,0 0 18px #58b8ff77,0 0 40px #3c9cff33}}
.card:focus-visible,.nav button:focus-visible,.btn:focus-visible,.item:focus-visible,.close:focus-visible{outline:3px solid #fff;outline-offset:3px}
.card.deal{animation:deal .55s var(--ease-out) both}
@keyframes deal{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}

/* Detail-Panel */
.detail{position:absolute;left:600px;top:0;right:0;height:628px;border-radius:26px;overflow:hidden;
  background:radial-gradient(ellipse 70% 80% at 72% 55%,color-mix(in srgb,var(--el) 22%,#123a5e),#0a1d31 75%);
  border:2px solid #3f8fd6aa;box-shadow:0 0 0 1px #9fd6ff22 inset,0 0 30px #2e8fff33;transition:background 1s}
.detail .mist{position:absolute;inset:0;background:radial-gradient(ellipse 40% 30% at 70% 85%,color-mix(in srgb,var(--el) 35%,transparent),transparent 70%);opacity:.6;transition:background 1s}
.d-text{position:absolute;left:46px;top:36px;width:380px;z-index:3}
.d-text h3{font-size:56px;font-weight:600;line-height:1.05}
.chip{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:6px 20px 6px 6px;border-radius:30px;border:1.5px solid #ffffff33;background:#0b2036aa;font-size:20px}
.chip i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--el) 30%,#0b2036);border:1.5px solid var(--el)}
.chip svg{width:24px;height:24px}
.d-text .lvl{font-size:30px;font-weight:500;margin-top:18px}
.d-text .desc{font-size:19px;line-height:1.5;color:var(--ink-2);margin-top:16px;min-height:142px}
.stat{display:grid;grid-template-columns:36px 1fr auto;align-items:center;column-gap:14px;margin-top:18px;width:380px}
.stat svg{width:30px;height:30px;grid-row:span 2}
.stat .lb{font-size:20px}
.stat .val{grid-row:span 2;font-size:21px;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.track{height:16px;border-radius:10px;background:#0a1a2b;border:1.5px solid #ffffff22;overflow:hidden;margin-top:6px;position:relative}
.fill{height:100%;border-radius:10px;width:0;transition:width .9s var(--ease-out);position:relative;overflow:hidden}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff66 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.fill.hp{background:linear-gradient(90deg,#1fa86b,var(--hp));box-shadow:0 0 12px #3fdc8a88}
.fill.en{background:linear-gradient(90deg,#2a73d6,var(--en));box-shadow:0 0 12px #4aa8ff88}
.fill.bump{animation:bump .6s var(--ease-spring)}
@keyframes bump{40%{filter:brightness(1.8)}}

.actions{position:absolute;left:36px;bottom:26px;display:flex;gap:18px;z-index:4}
.btn{height:64px;min-width:200px;padding:0 34px;border-radius:16px;font-size:26px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden;
  transition:transform .2s var(--ease-out),box-shadow .25s,background .25s,border-color .25s}
.btn svg{width:30px;height:30px;transition:transform .35s var(--ease-spring)}
.btn.ghost{background:#0d2640d9;border:2px solid #6aa6d8aa}
.btn.ghost:hover{border-color:#bfe6ff;background:#143559;box-shadow:0 0 20px #58b8ff55}
.btn.primary{min-width:290px;background:linear-gradient(180deg,#8fd6ff,#4aa8f0);color:var(--accent-ink);border:2px solid #d6f0ff;box-shadow:0 0 26px #58b8ffaa}
.btn.primary:hover{box-shadow:0 0 40px #8fd6ffee;transform:translateY(-2px)}
.btn.primary:hover svg{transform:scale(1.2) rotate(-12deg)}
.btn:active{transform:scale(.95)}
.btn.primary.on{background:linear-gradient(180deg,#9ff0c6,#3fdc8a);border-color:#e0ffef;box-shadow:0 0 30px #3fdc8aaa}
.ripple{position:absolute;border-radius:50%;background:#ffffff88;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* Wesen-Bühne */
.showcase{position:absolute;left:400px;right:0;top:0;height:100%;z-index:2}
.pedestal{position:absolute;left:10px;right:10px;bottom:96px;height:120px}
.pedestal svg{width:100%;height:100%;overflow:visible}
.runes{transform-origin:260px 60px;animation:spin 30s linear infinite}
.runes2{transform-origin:260px 60px;animation:spin 18s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pedglow{animation:pedGlow 3s ease-in-out infinite}
@keyframes pedGlow{50%{opacity:.55}}
.beam{position:absolute;left:90px;bottom:140px;width:280px;height:460px;background:linear-gradient(0deg,color-mix(in srgb,var(--el) 40%,#58b8ff) 0%,transparent 80%);opacity:0;clip-path:polygon(15% 100%,85% 100%,100% 0,0 0);filter:blur(10px);pointer-events:none}
.beam.flash{animation:beam .9s ease-out}
@keyframes beam{0%{opacity:0}30%{opacity:.75}100%{opacity:0}}
.creature-wrap{position:absolute;left:-70px;bottom:130px;width:520px;height:470px;cursor:pointer;transition:transform .25s ease-out}
.creature{width:100%;height:100%;animation:float 5s ease-in-out infinite}
.creature svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 16px 20px #00000088)}
@keyframes float{50%{transform:translateY(-10px)}}
.creature.out{animation:creatureOut .35s ease-in forwards}
.creature.in{animation:creatureIn .75s var(--ease-out) both, float 5s 0.75s ease-in-out infinite}
@keyframes creatureOut{to{opacity:0;transform:translateY(30px) scale(.85);filter:brightness(3) blur(4px)}}
@keyframes creatureIn{
  0%{opacity:0;transform:translateY(40px) scale(.7);filter:brightness(3) blur(6px);clip-path:inset(100% 0 0 0)}
  60%{opacity:1;filter:brightness(1.6) blur(0);clip-path:inset(0 0 0 0)}
  100%{transform:none;filter:none}}
.creature.happy svg{animation:hop .7s var(--ease-spring)}
@keyframes hop{30%{transform:translateY(-46px) scaleY(1.06)}55%{transform:translateY(0) scaleY(.92)}75%{transform:scaleY(1.03)}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
.mote{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--el);box-shadow:0 0 12px 3px var(--el);opacity:0;animation:mote var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes mote{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translate(var(--dx,20px),-180px) scale(1)}}
.pop{position:absolute;font-size:30px;font-weight:700;color:#fff;text-shadow:0 0 12px var(--pc,#3fdc8a),0 2px 0 #0008;animation:pop 1.3s var(--ease-out) forwards;pointer-events:none;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{opacity:0;transform:translateY(-110px) scale(1)}}
.spark{position:absolute;width:22px;height:22px;pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.2) rotate(180deg)}}

/* ---- Tier-Animationen (nur große Ansicht) ---- */
.big .c-body{animation:breathe 3.2s ease-in-out infinite}
.big .c-head{animation:headBob 4.6s ease-in-out infinite}
.big .c-tail{animation:tail 2.8s ease-in-out infinite}
.big .c-earL{animation:earL 6s ease-in-out infinite}
.big .c-earR{animation:earR 6s 1.3s ease-in-out infinite}
.big .c-eyes{animation:blink 5s infinite}
.big .c-glow{animation:glowLeaf 2.6s ease-in-out infinite}
.big .c-wingL{animation:wingL 1.6s ease-in-out infinite}
.big .c-wingR{animation:wingR 1.6s ease-in-out infinite}
.big .c-flame{animation:flame .5s ease-in-out infinite alternate}
.big .c-fin{animation:fin 2.2s ease-in-out infinite}
.big .c-ant{animation:ant 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015,1.035)}}
@keyframes headBob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg) translateY(2px)}}
@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes earL{0%,70%,80%,100%{transform:rotate(0)}74%{transform:rotate(-14deg)}}
@keyframes earR{0%,70%,80%,100%{transform:rotate(0)}74%{transform:rotate(14deg)}}
@keyframes blink{0%,46%,50%,94%,100%{transform:scaleY(1)}48%,97%{transform:scaleY(.08)}}
@keyframes glowLeaf{50%{opacity:.35;filter:brightness(1.6)}}
@keyframes wingL{50%{transform:rotate(-14deg) scaleX(.9)}}
@keyframes wingR{50%{transform:rotate(14deg) scaleX(.9)}}
@keyframes flame{to{transform:scale(1.08,1.15) translateY(-3px)}}
@keyframes fin{50%{transform:rotate(-8deg)}}
@keyframes ant{50%{transform:rotate(6deg)}}
.c-eyes,.c-body,.c-head,.c-tail,.c-earL,.c-earR,.c-wingL,.c-wingR,.c-flame,.c-fin,.c-ant{transform-box:view-box}

/* ---------- Schnellzugriff ---------- */
.quick{position:absolute;left:0;right:0;bottom:42px;height:132px;border-radius:24px;background:#0a1e33cc;border:1.5px solid #2a5f8f99;display:flex;align-items:center;padding:0 20px 0 30px;gap:16px}
.quick h4{width:200px;align-self:flex-start;margin-top:22px;display:flex;gap:14px;align-items:center;font-size:24px;font-weight:500}
.quick h4 svg{width:34px;height:34px}
.item{width:222px;height:104px;border-radius:16px;background:var(--card);border:1.5px solid #2a5f8f99;display:flex;align-items:center;gap:8px;padding:0 14px 0 6px;text-align:left;position:relative;transition:transform .25s var(--ease-out),border-color .25s,box-shadow .25s,background .25s,opacity .3s}
.item .ic{width:88px;height:88px;flex:none;transition:transform .4s var(--ease-spring)}
.item .ic svg{width:100%;height:100%}
.item b{display:block;font-weight:400;font-size:19px}
.item em{display:block;font-style:normal;font-size:24px;margin-top:6px;font-variant-numeric:tabular-nums}
.item:hover{transform:translateY(-5px);border-color:#58b8ffcc;background:var(--card-hover);box-shadow:0 0 20px #3c9cff44}
.item:hover .ic{transform:rotate(-10deg) scale(1.1)}
.item:active{transform:scale(.94)}
.item.used .ic{animation:used .5s var(--ease-spring)}
@keyframes used{40%{transform:scale(1.3) rotate(8deg)}}
.item.no{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.item[aria-disabled="true"]{opacity:.4}
.item .tip{position:absolute;left:50%;bottom:calc(100% + 14px);transform:translateX(-50%) translateY(6px);padding:8px 14px;border-radius:10px;background:#0f2e4cf2;border:1.5px solid var(--line-soft);font-size:17px;color:var(--ink-2);white-space:nowrap;opacity:0;pointer-events:none;transition:.25s var(--ease-out)}
.item:hover .tip,.item:focus-visible .tip{opacity:1;transform:translateX(-50%)}
.vsep{width:2px;height:90px;background:#3f8fd666;margin:0 6px}
.bag{margin-left:auto;height:100px;padding:0 26px;border-radius:16px;border:2px solid #6aa6d8aa;background:#0d2640d9;display:flex;align-items:center;gap:18px;font-size:22px;transition:.25s var(--ease-out)}
.bag svg{width:40px;height:40px}
.bag .chev{width:22px;height:22px;transition:transform .3s var(--ease-out)}
.bag:hover{border-color:#bfe6ff;box-shadow:0 0 20px #58b8ff55;background:#143559}
.bag:hover .chev{transform:translateX(5px)}
.bag:active{transform:scale(.96)}

.hints{position:absolute;right:20px;bottom:0;display:flex;align-items:center;gap:14px;font-size:18px;color:var(--ink-2)}
kbd{font-family:inherit;font-size:18px;padding:3px 10px;border-radius:7px;border:1.5px solid #a9c3dc99;color:var(--ink)}
.hints .sep{width:1.5px;height:24px;background:#a9c3dc55;margin:0 10px}

/* Platzhalter-Tabs */
.ph{position:absolute;inset:0 0 44px 0;border-radius:26px;border:2px dashed #3f8fd666;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:24px}
.ph h2{font-size:44px;color:var(--ink);margin-bottom:12px;font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

const itemsEl=$('#items');
items.forEach(it=>{const b=document.createElement('button');b.className='item';
 b.innerHTML=`<span class="ic">${ITEM_SVG[it.art]}</span><span><b>${it.name}</b><em>x${it.n}</em></span><span class="tip">${it.tip}</span>`;
 b.addEventListener('click',()=>useItem(it,b));itemsEl.appendChild(b)});
function useItem(it,b){
 const t=team[sel];
 if(it.n<=0)return;
 if(!it.use){b.classList.remove('no');void b.offsetWidth;b.classList.add('no');say(it.name+' kann hier nicht benutzt werden.');return}
 const full=(it.use.hp&&t.hp>=t.hpMax)||(it.use.en&&t.en>=t.enMax);
 if(full){b.classList.remove('no');void b.offsetWidth;b.classList.add('no');say(t.name+' braucht das gerade nicht.');return}
 it.n--;b.querySelector('em').textContent='x'+it.n;if(!it.n)b.setAttribute('aria-disabled','true');
 b.classList.remove('used');void b.offsetWidth;b.classList.add('used');
 if(it.use.hp){const g=Math.min(it.use.hp,t.hpMax-t.hp);t.hp+=g;pop('+'+g+' Leben','#3fdc8a');bump('#hpF');sparks('#3fdc8a')}
 if(it.use.en){const g=Math.min(it.use.en,t.enMax-t.en);t.en+=g;pop('+'+g+' Energie','#4aa8ff');bump('#enF');sparks('#4aa8ff')}
 updateStats();say(t.name+' fühlt sich besser!');
}
function bump(s){const f=$(s);f.classList.remove('bump');void f.offsetWidth;f.classList.add('bump')}

/* ======================= Öffnen / Schließen ======================= */
const win=$('#win');let open=false;
function openInv(){if(open)return;open=true;$('#summon').classList.remove('show');
 win.className='opening';renderGrid();select(sel,true);setTab(tab);setTimeout(()=>say('Hallo! Hier ist dein Team.'),900);}
function closeInv(){if(!open)return;open=false;win.className='closing';
 setTimeout(()=>{win.className='closed';$('#summon').classList.add('show')},480);}
$('#closeBtn').addEventListener('click',closeInv);
$('#summon').addEventListener('click',openInv);

/* ======================= Tastatur ======================= */
addEventListener('keydown',e=>{
 if(!open){if(e.key==='i'||e.key==='I'||e.key==='Enter'){openInv();e.preventDefault()}return}
 if(e.key==='Escape'){closeInv();return}
 if(e.key==='Tab'){e.preventDefault();const ids=NAV.map(n=>n[0]);let k=ids.indexOf(tab);k=(k+(e.shiftKey?-1:1)+ids.length)%ids.length;setTab(ids[k]);return}
 if(tab!=='wesen')return;
 const mv={ArrowRight:1,ArrowLeft:-1,ArrowDown:2,ArrowUp:-2}[e.key];
 if(mv!==undefined){e.preventDefault();const n=sel+mv;if(n>=0&&n<team.length){select(n);grid.children[n].focus({preventScroll:true})}}
 if(e.key==='Enter'&&document.activeElement===document.body)$('#btnFollow').click();
 if(['1','2','3','4'].includes(e.key))itemsEl.children[+e.key-1].click();
});

openInv();
</script>
</body>
</html>
